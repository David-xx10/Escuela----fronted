<header class="crud-barra"><h2>Cursos</h2><form class="filtro" (submit)="$event.preventDefault(); buscarPorId()"><input [(ngModel)]="idFiltro" name="idFiltro" placeholder="Filtrar por ID" autocomplete="off" /><button type="submit" [disabled]="cargando()">Buscar</button><button type="button" class="secundario" (click)="limpiarFiltro()" [disabled]="cargando()">Todos</button></form><button type="button" (click)="abrirCrear()">+ Crear</button></header>
@if (mensaje()) { <p class="mensaje" [class.error]="esError()">{{ mensaje() }}</p> }
<table><thead><tr><th>ID</th><th>Nombre</th><th>Créditos</th><th>Facultad</th><th></th></tr></thead><tbody>
@for (fila of filas(); track fila.id_curso) { <tr><td class="id">{{ fila.id_curso }}</td><td>{{ fila.nombre }}</td><td>{{ fila.creditos }}</td><td>{{ fila.id_facultad }}</td><td class="acciones"><button type="button" (click)="abrirEditar(fila)">Editar</button><button type="button" class="peligro" (click)="eliminar(fila)">Eliminar</button></td></tr> }
</tbody></table>
@if (popupAbierto()) { <div class="fondo-popup" (click)="cerrarPopup()"><form class="popup" (click)="$event.stopPropagation()" (ngSubmit)="guardar()"><h3>{{ modo() === 'crear' ? 'Crear curso' : 'Editar curso' }}</h3><label class="campo"><span>Nombre</span><input [(ngModel)]="formulario.nombre" name="nombre" required /></label><label class="campo"><span>Créditos</span><input [(ngModel)]="formulario.creditos" name="creditos" type="number" min="1" required /></label><label class="campo"><span>ID facultad</span><input [(ngModel)]="formulario.id_facultad" name="id_facultad" type="number" required /></label><div class="popup-acciones"><button type="button" class="secundario" (click)="cerrarPopup()">Cancelar</button><button type="submit" [disabled]="cargando()">Guardar</button></div></form></div> }
